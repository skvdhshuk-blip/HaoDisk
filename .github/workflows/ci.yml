name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Core behavior tests
        run: swift test
      - name: Native navigation and cleanup workflow tests
        run: >-
          xcodebuild -project HaoDisk.xcodeproj -scheme HaoDisk
          -destination 'platform=macOS' -derivedDataPath .build/xcode-tests
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test
      - name: Build sandboxed Release configuration
        run: >-
          xcodebuild -project HaoDisk.xcodeproj -scheme HaoDisk
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
      - name: Validate privacy and entitlement files
        run: plutil -lint HaoDisk/Resources/PrivacyInfo.xcprivacy HaoDisk/Resources/HaoDisk.entitlements
      - name: Verify packaged version matches Xcode settings
        run: |
          xcodebuild -project HaoDisk.xcodeproj -scheme HaoDisk -configuration Release -showBuildSettings -json > .build/release-settings.json
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          settings = next(item['buildSettings'] for item in json.loads(Path('.build/release-settings.json').read_text()) if item['target'] == 'HaoDisk')
          info = plistlib.loads(Path('.build/xcode/Build/Products/Release/HaoDisk.app/Contents/Info.plist').read_bytes())
          assert info['CFBundleShortVersionString'] == settings['MARKETING_VERSION']
          assert info['CFBundleVersion'] == settings['CURRENT_PROJECT_VERSION']
          PY
